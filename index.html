<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RODRI EDUCA · Panel del profesor</title>
<style>
:root{--blue:#3478d4;--ink:#17243a;--muted:#69778c;--line:#e4eaf2;--bg:#f4f7fb;--card:#fff;--green:#16865b;--red:#c34444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:850;letter-spacing:-.7px;color:var(--blue)}.sub{color:var(--muted);font-size:12px;margin:2px 0 25px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#536176;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:#eaf2ff;color:#1d5eb2;font-weight:700}.sidefoot{position:absolute;bottom:18px;left:18px;right:18px;color:var(--muted);font-size:11px}.main{padding:30px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.top h1{margin:0;font-size:27px;letter-spacing:-.6px}.top p{margin:3px 0 0;color:var(--muted)}.pill{background:#e8f7ef;color:#14784e;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #1c355008}.metric{font-size:29px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:700;color:#4a5870}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d7e0eb;border-radius:9px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:78px;resize:vertical}button,.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:white;font:600 13px system-ui;cursor:pointer}button.secondary{background:#edf2f8;color:#34445b}button.danger{background:#fff0f0;color:#a52e2e}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:700}.tag{display:inline-block;background:#eef4fc;color:#315e97;border-radius:99px;padding:3px 8px;font-size:11px}.empty{padding:24px;text-align:center;color:var(--muted);background:#f8fafd;border-radius:10px}.section-title{font-size:17px;font-weight:800;margin:0 0 12px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.score{font-size:20px;font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none!important}.checkline{display:flex;align-items:center;gap:8px;margin:8px 0}.checkline input{width:auto}.qbox{background:#f7f9fc;padding:13px;border-radius:10px;margin:10px 0}.notice{background:#fff8e8;border:1px solid #f4dfaa;padding:12px;border-radius:10px;color:#73551c;font-size:12px;margin:15px 0}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:14px}.brand{font-size:20px}.sub{margin-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.sidefoot{display:none}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.top h1{font-size:22px}}
@media print{.side,.top .pill,.no-print,button{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">RODRI EDUCA</div><div class="sub">Tu espacio de apoyo educativo</div><nav class="nav" id="nav">
<button data-page="home" class="active">⌂ &nbsp; Inicio</button><button data-page="students">♙ &nbsp; Alumnos</button><button data-page="grades">▤ &nbsp; Calificaciones</button><button data-page="activities">✎ &nbsp; Actividades y exámenes</button><button data-page="groups">▦ &nbsp; Grupos</button><button data-page="calendar">▣ &nbsp; Calendario</button><button data-page="reports">▥ &nbsp; Informes</button><button data-page="settings">⚙ &nbsp; Datos y ajustes</button></nav><div class="sidefoot">Versión inicial · Los datos se guardan en este navegador.</div></aside>
<main class="main"><header class="top"><div><h1 id="pageTitle">Inicio</h1><p id="pageDesc">Resumen de tus aulas y actividad educativa.</p></div><span class="pill">● Guardado local</span></header><div id="view"></div></main></div>
<script>
const COURSES=['1.º Primaria','5.º Primaria'];const SUBJECTS={'1.º Primaria':['Lengua','Matemáticas','Conocimiento del Medio','Inglés'],'5.º Primaria':['Lengua','Matemáticas','Ciencias Naturales','Ciencias Sociales','Inglés']};
const defaults={students:[{id:1,name:'Alumno 1',course:COURSES[0],group:'A'},{id:2,name:'Alumno 2',course:COURSES[1],group:'A'}],grades:[],activities:[],groups:[{id:1,name:'Grupo A',course:COURSES[0],members:'Alumno 1'},{id:2,name:'Grupo A',course:COURSES[1],members:'Alumno 2'}],events:[],observations:[]};
let data;try{data=JSON.parse(localStorage.getItem('rodrI_educa_v1'))||structuredClone(defaults)}catch(e){data=structuredClone(defaults)}
function save(){localStorage.setItem('rodrI_educa_v1',JSON.stringify(data));document.querySelector('.pill').textContent='● Guardado local'}
let page='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const courseSelect=(id='course',val=COURSES[0])=>`<select id="${id}">${COURSES.map(c=>`<option ${c===val?'selected':''}>${c}</option>`).join('')}</select>`;const subjectSelect=(course,id='subject')=>`<select id="${id}">${SUBJECTS[course].map(s=>`<option>${s}</option>`).join('')}</select>`;
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function cardMetric(label,value,detail=''){return `<div class="card"><div class="muted small">${label}</div><div class="metric">${value}</div><div class="muted small">${detail}</div></div>`}
function render(){const titles={home:['Inicio','Resumen de tus aulas y actividad educativa.'],students:['Alumnos','Fichas individuales y organización de estudiantes.'],grades:['Calificaciones','Registra notas y consulta el historial.'],activities:['Actividades y exámenes','Crea cuestionarios de opción múltiple y corrígelos.'],groups:['Grupos','Organiza tus aulas en grupos de trabajo.'],calendar:['Calendario','Planifica clases, pruebas y actividades.'],reports:['Informes','Consulta medias y prepara informes imprimibles.'],settings:['Datos y ajustes','Exporta una copia de seguridad o restaura tus datos.']};$('#pageTitle').textContent=titles[page][0];$('#pageDesc').textContent=titles[page][1];const v=$('#view');v.innerHTML=({home:homePage,students:studentsPage,grades:gradesPage,activities:activitiesPage,groups:groupsPage,calendar:calendarPage,reports:reportsPage,settings:settingsPage})[page]();wire()}
function homePage(){let avg=data.grades.length?(data.grades.reduce((a,g)=>a+g.mark,0)/data.grades.length).toFixed(1):'—';return `<div class="grid">${cardMetric('Alumnos',data.students.length,'En las dos aulas')}${cardMetric('Calificaciones',data.grades.length,'Notas registradas')}${cardMetric('Actividades',data.activities.length,'Cuestionarios creados')}${cardMetric('Media general',avg,'Sobre 10')}</div><div class="two"><section class="card"><h2 class="section-title">Tus aulas</h2>${COURSES.map(c=>`<div class="item"><div><b>${c}</b><div class="muted small">${data.students.filter(s=>s.course===c).length} alumno(s)</div></div><span class="tag">Aula</span></div>`).join('')}</section><section class="card"><h2 class="section-title">Últimas calificaciones</h2>${data.grades.slice(0,5).map(g=>`<div class="item"><div><b>${esc(g.student)}</b><div class="muted small">${esc(g.subject)} · ${esc(g.title)}</div></div><b class="score ${g.mark>=5?'good':'bad'}">${g.mark}/10</b></div>`).join('')||'<div class="empty">Aún no hay notas. Puedes añadirlas desde Calificaciones.</div>'}</section></div><div class="notice">Consejo de privacidad: utiliza alias (por ejemplo, Alumno 1) y evita introducir apellidos, direcciones, teléfonos u otros datos personales de menores.</div>`}
function studentsPage(){return `<div class="two"><section class="card"><h2 class="section-title">Añadir alumno</h2><div class="field"><label>Nombre o alias</label><input id="sname" placeholder="Ej. Alumno 3"></div><div class="field"><label>Curso</label>${courseSelect()}</div><div class="field"><label>Grupo</label><input id="sgroup" value="A"></div><button id="addStudent">Añadir alumno</button></section><section class="card"><h2 class="section-title">Alumnos registrados</h2><div class="list">${data.students.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><div class="muted small">${s.course} · Grupo ${esc(s.group||'—')}</div></div><button class="danger" data-delstudent="${s.id}">Eliminar</button></div>`).join('')||'<div class="empty">No hay alumnos.</div>'}</div></section></div><section class="card"><h2 class="section-title">Ficha de alumno</h2><div class="field"><label>Selecciona alumno</label><select id="profileStudent">${data.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.course}</option>`).join('')}</select></div><div id="profile"></div></section>`}
function profileRender(){let s=data.students.find(x=>x.id==$('#profileStudent')?.value)||data.students[0];let p=$('#profile');if(!p||!s){if(p)p.innerHTML='<div class="empty">Añade un alumno para ver su ficha.</div>';return}let gs=data.grades.filter(g=>g.student===s.name&&g.course===s.course);let mean=gs.length?(gs.reduce((a,g)=>a+g.mark,0)/gs.length).toFixed(2):'—';let obs=data.observations.filter(o=>o.student===s.name&&o.course===s.course);p.innerHTML=`<div class="grid">${cardMetric('Notas',gs.length,'Registradas')}${cardMetric('Media',mean,'Sobre 10')}</div><h3>Historial</h3>${gs.map(g=>`<div class="item"><span>${esc(g.subject)} · ${esc(g.title)}</span><b class="score ${g.mark>=5?'good':'bad'}">${g.mark}/10</b></div>`).join('')||'<div class="empty">Sin calificaciones todavía.</div>'}<h3>Observaciones</h3><textarea id="obsText" placeholder="Anota observaciones educativas, sin datos sensibles..."></textarea><button id="addObs">Guardar observación</button>${obs.map(o=>`<p class="item">${esc(o.text)}</p>`).join('')}`}
function gradesPage(){return `<div class="two"><section class="card"><h2 class="section-title">Registrar nota</h2><div class="field"><label>Alumno</label><select id="gstudent">${data.students.map(s=>`<option>${esc(s.name)}|${s.course}</option>`).join('')}</select></div><div class="field"><label>Asignatura</label><select id="gsubject"></select></div><div class="field"><label>Actividad o examen</label><input id="gtitle" placeholder="Ej. Control del tema 2"></div><div class="field"><label>Nota sobre 10</label><input id="gmark" type="number" min="0" max="10" step="0.1" placeholder="8"></div><button id="addGrade">Guardar calificación</button></section><section class="card"><h2 class="section-title">Resumen</h2>${COURSES.map(c=>{let a=data.grades.filter(g=>g.course===c);return `<div class="item"><div><b>${c}</b><div class="muted small">${a.length} nota(s)</div></div><b>${a.length?(a.reduce((x,g)=>x+g.mark,0)/a.length).toFixed(2)+'/10':'—'}</b></div>`}).join('')}</section></div><section class="card"><h2 class="section-title">Todas las calificaciones</h2><div class="tablewrap"><table><thead><tr><th>Alumno</th><th>Curso</th><th>Asignatura</th><th>Actividad</th><th>Nota</th><th></th></tr></thead><tbody>${data.grades.map(g=>`<tr><td>${esc(g.student)}</td><td>${g.course}</td><td>${esc(g.subject)}</td><td>${esc(g.title)}</td><td><b>${g.mark}/10</b></td><td><button class="danger" data-delgrade="${g.id}">Borrar</button></td></tr>`).join('')||'<tr><td colspan="6">Todavía no hay notas.</td></tr>'}</tbody></table></div></section>`}
function activitiesPage(){return `<div class="two"><section class="card"><h2 class="section-title">Crear cuestionario</h2><div class="field"><label>Nombre</label><input id="qtitle" placeholder="Repaso del tema 1"></div><div class="field"><label>Curso</label>${courseSelect('qcourse')}</div><div class="field"><label>Asignatura</label><select id="qsubject"></select></div><div id="questionEditor"><div class="qbox"><div class="field"><label>Pregunta</label><input id="question" placeholder="¿Cuánto es 2 + 2?"></div><div class="field"><label>Opción A</label><input id="qa" placeholder="3"></div><div class="field"><label>Opción B</label><input id="qb" placeholder="4"></div><div class="field"><label>Opción C</label><input id="qc" placeholder="5"></div><div class="field"><label>Respuesta correcta</label><select id="qcorrect"><option>A</option><option selected>B</option><option>C</option></select></div><button class="secondary" id="addQuestion">Añadir pregunta</button></div></div><div id="qDraft" class="muted small">0 preguntas añadidas</div><button id="saveQuiz">Guardar cuestionario</button></section><section class="card"><h2 class="section-title">Tus cuestionarios</h2>${data.activities.map(a=>`<div class="item"><div><b>${esc(a.title)}</b><div class="muted small">${a.course} · ${esc(a.subject)} · ${a.questions.length} preguntas</div></div><button data-take="${a.id}">Realizar</button></div>`).join('')||'<div class="empty">Todavía no has creado actividades.</div>'}</section></div><section class="card hidden" id="takeCard"><h2 class="section-title" id="takeTitle">Realizar actividad</h2><div class="field"><label>Alumno</label><select id="takeStudent"></select></div><div id="takeQuestions"></div><button id="correctQuiz">Corregir y guardar nota</button><div id="quizResult"></div></section>`}
function groupsPage(){return `<div class="two"><section class="card"><h2 class="section-title">Crear grupo</h2><div class="field"><label>Nombre del grupo</label><input id="groupName" placeholder="Ej. Grupo de lectura"></div><div class="field"><label>Curso</label>${courseSelect('groupCourse')}</div><div class="field"><label>Alumnos (puedes escribir alias separados por comas)</label><textarea id="groupMembers" placeholder="Alumno 1, Alumno 2"></textarea></div><button id="addGroup">Crear grupo</button></section><section class="card"><h2 class="section-title">Grupos existentes</h2>${data.groups.map(g=>`<div class="item"><div><b>${esc(g.name)}</b><div class="muted small">${g.course} · ${esc(g.members)}</div></div><button class="danger" data-delgroup="${g.id}">Eliminar</button></div>`).join('')||'<div class="empty">No hay grupos creados.</div>'}</section></div>`}
function calendarPage(){return `<div class="two"><section class="card"><h2 class="section-title">Añadir evento</h2><div class="field"><label>Nombre</label><input id="eventName" placeholder="Ej. Examen de Matemáticas"></div><div class="field"><label>Fecha</label><input id="eventDate" type="date"></div><div class="field"><label>Curso</label>${courseSelect('eventCourse')}</div><button id="addEvent">Añadir al calendario</button></section><section class="card"><h2 class="section-title">Próximos eventos</h2>${[...data.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="item"><div><b>${esc(e.name)}</b><div class="muted small">${e.date} · ${e.course}</div></div><button class="danger" data-delevent="${e.id}">Eliminar</button></div>`).join('')||'<div class="empty">No hay eventos planificados.</div>'}</section></div>`}
function reportsPage(){return `<section class="card"><div class="row between"><h2 class="section-title">Informe de evaluación</h2><button class="no-print" onclick="window.print()">Imprimir / Guardar PDF</button></div><div class="field"><label>Curso</label>${courseSelect('reportCourse')}</div><div id="reportTable"></div></section>`}
function settingsPage(){return `<section class="card"><h2 class="section-title">Copia de seguridad</h2><p class="muted">Descarga todos tus alumnos, notas, actividades, grupos, observaciones y eventos en un archivo JSON.</p><button id="backup">Descargar copia de seguridad</button><div class="field"><label>Restaurar una copia JSON</label><input type="file" id="restoreFile" accept="application/json"></div><button class="secondary" id="restore">Restaurar datos</button></section><section class="card"><h2 class="section-title">Privacidad y funcionamiento</h2><p>Esta versión guarda los datos únicamente en el almacenamiento local de este navegador. No hay cuentas, sincronización entre dispositivos ni servidor conectado.</p><p>Usa alias y no introduzcas información personal sensible de menores. Si borras los datos del navegador, puedes perder la información; descarga copias de seguridad periódicamente.</p><button class="danger" id="reset">Restablecer plataforma</button></section>`}
let draft=[],currentQuiz=null;
function wire(){if(page==='students'){if($('#addStudent'))$('#addStudent').onclick=()=>{let name=$('#sname').value.trim();if(!name)return;data.students.push({id:Date.now(),name,course:$('#course').value,group:$('#sgroup').value.trim()});save();render()};document.querySelectorAll('[data-delstudent]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este alumno?')){data.students=data.students.filter(s=>s.id!=b.dataset.delstudent);save();render()}});if($('#profileStudent')){$('#profileStudent').onchange=profileRender;profileRender()}if($('#addObs'))$('#addObs').onclick=()=>{let s=data.students.find(x=>x.id==$('#profileStudent').value),t=$('#obsText').value.trim();if(s&&t){data.observations.push({id:Date.now(),student:s.name,course:s.course,text:t});save();profileRender()}}}
if(page==='grades'){const update=()=>{let c=$('#gstudent').value.split('|')[1];$('#gsubject').innerHTML=SUBJECTS[c].map(s=>`<option>${s}</option>`).join('')};if($('#gstudent')){$('#gstudent').onchange=update;update()}if($('#addGrade'))$('#addGrade').onclick=()=>{let [student,course]=$('#gstudent').value.split('|'),mark=Number($('#gmark').value);if(!$('#gtitle').value.trim()||$('#gmark').value===''||mark<0||mark>10||!Number.isFinite(mark))return alert('Completa la actividad y una nota válida de 0 a 10.');data.grades.unshift({id:Date.now(),student,course,subject:$('#gsubject').value,title:$('#gtitle').value.trim(),mark});save();render()};document.querySelectorAll('[data-delgrade]').forEach(b=>b.onclick=()=>{data.grades=data.grades.filter(g=>g.id!=b.dataset.delgrade);save();render()})}
if(page==='activities'){let update=()=>{$('#qsubject').innerHTML=SUBJECTS[$('#qcourse').value].map(s=>`<option>${s}</option>`).join('')};$('#qcourse').onchange=update;update();$('#addQuestion').onclick=()=>{let q=$('#question').value.trim(),a=$('#qa').value.trim(),b=$('#qb').value.trim(),c=$('#qc').value.trim();if(!q||!a||!b||!c)return alert('Completa el enunciado y las tres opciones.');draft.push({q,a,b,c,correct:$('#qcorrect').value});$('#qDraft').textContent=draft.length+' pregunta(s) añadida(s)';['question','qa','qb','qc'].forEach(id=>$('#'+id).value='')};$('#saveQuiz').onclick=()=>{if(!$('#qtitle').value.trim()||!draft.length)return alert('Pon un nombre y añade al menos una pregunta.');data.activities.unshift({id:Date.now(),title:$('#qtitle').value.trim(),course:$('#qcourse').value,subject:$('#qsubject').value,questions:draft});draft=[];save();render()};document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{currentQuiz=data.activities.find(a=>a.id==b.dataset.take);$('#takeCard').classList.remove('hidden');$('#takeTitle').textContent=currentQuiz.title;$('#takeStudent').innerHTML=data.students.filter(s=>s.course===currentQuiz.course).map(s=>`<option>${esc(s.name)}</option>`).join('');$('#takeQuestions').innerHTML=currentQuiz.questions.map((q,i)=>`<div class="qbox"><b>${i+1}. ${esc(q.q)}</b>${['A','B','C'].map(k=>`<label class="checkline"><input type="radio" name="ans${i}" value="${k}"> ${k}) ${esc(q[k.toLowerCase()])}</label>`).join('')}</div>`).join('');$('#quizResult').innerHTML='';$('#correctQuiz').onclick=()=>{let correct=0,answered=true;currentQuiz.questions.forEach((q,i)=>{let x=document.querySelector(`input[name="ans${i}"]:checked`);if(!x)answered=false;else if(x.value===q.correct)correct++});if(!answered)return alert('Contesta todas las preguntas antes de corregir.');let student=$('#takeStudent').value,mark=Math.round(correct/currentQuiz.questions.length*100)/10;data.grades.unshift({id:Date.now(),student,course:currentQuiz.course,subject:currentQuiz.subject,title:currentQuiz.title,mark});save();$('#quizResult').innerHTML=`<div class="notice">Resultado: ${correct}/${currentQuiz.questions.length} · Nota: <b>${mark}/10</b>. Se ha añadido al cuaderno de calificaciones.</div>`}})}
if(page==='groups'){ $('#addGroup').onclick=()=>{let name=$('#groupName').value.trim();if(!name)return;data.groups.push({id:Date.now(),name,course:$('#groupCourse').value,members:$('#groupMembers').value.trim()});save();render()};document.querySelectorAll('[data-delgroup]').forEach(b=>b.onclick=()=>{data.groups=data.groups.filter(g=>g.id!=b.dataset.delgroup);save();render()})}
if(page==='calendar'){$('#addEvent').onclick=()=>{if(!$('#eventName').value.trim()||!$('#eventDate').value)return alert('Indica nombre y fecha.');data.events.push({id:Date.now(),name:$('#eventName').value.trim(),date:$('#eventDate').value,course:$('#eventCourse').value});save();render()};document.querySelectorAll('[data-delevent]').forEach(b=>b.onclick=()=>{data.events=data.events.filter(e=>e.id!=b.dataset.delevent);save();render()})}
if(page==='reports'){let update=()=>{let c=$('#reportCourse').value,students=data.students.filter(s=>s.course===c);$('#reportTable').innerHTML=`<h3>${c}</h3><div class="tablewrap"><table><thead><tr><th>Alumno</th>${SUBJECTS[c].map(s=>`<th>${s}</th>`).join('')}<th>Media</th></tr></thead><tbody>${students.map(s=>{let gs=data.grades.filter(g=>g.student===s.name&&g.course===c),avg=gs.length?(gs.reduce((a,g)=>a+g.mark,0)/gs.length).toFixed(2):'—';return `<tr><td>${esc(s.name)}</td>${SUBJECTS[c].map(sub=>{let a=gs.filter(g=>g.subject===sub);return `<td>${a.length?(a.reduce((x,g)=>x+g.mark,0)/a.length).toFixed(1):'—'}</td>`}).join('')}<td><b>${avg}</b></td></tr>`}).join('')}</tbody></table></div>`};$('#reportCourse').onchange=update;update()}
if(page==='settings'){$('#backup').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rodrI_educa_copia.json';a.click();URL.revokeObjectURL(a.href)};$('#restore').onclick=()=>{let f=$('#restoreFile').files[0];if(!f)return alert('Selecciona primero un archivo JSON.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.students||!d.grades||!d.activities)throw 0;data={...defaults,...d};save();render();alert('Copia restaurada.')}catch(e){alert('El archivo no parece una copia válida de RODRI EDUCA.')}};r.readAsText(f)};$('#reset').onclick=()=>{if(confirm('¿Seguro? Se borrarán los datos locales. Descarga antes una copia si la necesitas.')){data=structuredClone(defaults);save();render()}}}}
render();
</script></body></html>
